<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Emin Bilgen. Founder, Web and Infrastructure.">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#232327" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="30%" cy="45%" r="75%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="m"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5b2e" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff5b2e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="#0a0a0b"/>
  <rect width="1200" height="320" fill="url(#grid)" mask="url(#m)" opacity=".8"/>
  <ellipse cx="930" cy="170" rx="260" ry="150" fill="url(#glow)"/>
  <rect x="0" y="0" width="6" height="320" fill="#ff5b2e"/>

  <!-- text -->
  <text x="64" y="76" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" letter-spacing="3" fill="#ff5b2e">FOUNDER · WEB &amp; INFRASTRUCTURE</text>
  <text x="60" y="172" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="-4" fill="#ecebe6">Emin Bilgen<tspan fill="#ff5b2e">.</tspan></text>

  <g font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#bdbcb6">
    <text x="64" y="236" opacity="0">Premium websites.
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.22;0.27;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
    <text x="64" y="236" opacity="0">Payment systems.
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.22;0.27;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
    <text x="64" y="236" opacity="0">AI tooling.
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.22;0.27;1" dur="12s" begin="6s" repeatCount="indefinite"/></text>
    <text x="64" y="236" opacity="0">Built and hosted end to end.
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.22;0.27;1" dur="12s" begin="9s" repeatCount="indefinite"/></text>
  </g>
  <rect x="64" y="262" width="56" height="3" fill="#ff5b2e"/>

  <!-- floating tower: design / build / host / pay -->
  <g transform="translate(930 0)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="5s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/>
      <g transform="translate(0 222)"> <!-- slab 0: bottom -->
        <polygon points="-110,32 0,64 0,92 -110,60" fill="#131315" stroke="#ff5b2e" stroke-opacity=".5"/>
        <polygon points="0,64 110,32 110,60 0,92" fill="#0e0e10" stroke="#ff5b2e" stroke-opacity=".5"/>
        <polygon points="0,0 110,32 0,64 -110,32" fill="#1b1b1e" stroke="#ff5b2e" stroke-opacity=".8"/>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="5s" begin=".4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/>
      <g transform="translate(0 176)">
        <polygon points="-110,32 0,64 0,92 -110,60" fill="#131315" stroke="#ff5b2e" stroke-opacity=".5"/>
        <polygon points="0,64 110,32 110,60 0,92" fill="#0e0e10" stroke="#ff5b2e" stroke-opacity=".5"/>
        <polygon points="0,0 110,32 0,64 -110,32" fill="#1b1b1e" stroke="#ff5b2e" stroke-opacity=".8"/>
        <circle cx="70" cy="58" r="3" fill="#ff5b2e"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -13;0 0" dur="5s" begin=".8s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/>
      <g transform="translate(0 130)">
        <polygon points="-110,32 0,64 0,92 -110,60" fill="#131315" stroke="#ff5b2e" stroke-opacity=".5"/>
        <polygon points="0,64 110,32 110,60 0,92" fill="#0e0e10" stroke="#ff5b2e" stroke-opacity=".5"/>
        <polygon points="0,0 110,32 0,64 -110,32" fill="#1b1b1e" stroke="#ff5b2e" stroke-opacity=".8"/>
        <circle cx="70" cy="58" r="3" fill="#5bd68a"><animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/></circle>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 0" dur="5s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/>
      <g transform="translate(0 84)"> <!-- slab 3: top, lit -->
        <polygon points="-110,32 0,64 0,92 -110,60" fill="#131315" stroke="#ff5b2e" stroke-opacity=".6"/>
        <polygon points="0,64 110,32 110,60 0,92" fill="#0e0e10" stroke="#ff5b2e" stroke-opacity=".6"/>
        <polygon points="0,0 110,32 0,64 -110,32" fill="#ff5b2e" fill-opacity=".16" stroke="#ff5b2e">
          <animate attributeName="fill-opacity" values=".12;.34;.12" dur="3s" repeatCount="indefinite"/>
        </polygon>
      </g>
    </g>
  </g>
</svg>
